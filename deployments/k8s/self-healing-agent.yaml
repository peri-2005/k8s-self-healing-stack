apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healer-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: self-healer-clusterrole
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: self-healer-crb
subjects:
- kind: ServiceAccount
  name: self-healer-sa
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: self-healer-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-self-healer-deployment
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healer
  template:
    metadata:
      labels:
        app: self-healer
    spec:
      serviceAccountName: self-healer-sa
      containers:
      - name: healing-engine
        image: local-registry/k8s-self-healer:v1.0.0
        imagePullPolicy: IfNotPresent
