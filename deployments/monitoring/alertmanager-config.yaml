alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      receiver: 'slack-webhook-channel'
    receivers:
    - name: 'slack-webhook-channel'
      slack_configs:
      - api_url: 'https://slack.com' # Replace with your active Slack incoming webhook URL
        channel: '#devops-alerts'
        send_resolved: true
        title: '[{{ .Status | uppercase }}] Kubernetes Auto-Healing Notification'
        text: "{{ range .Alerts }}{{ .Annotations.description }}\n{{ end }}"
