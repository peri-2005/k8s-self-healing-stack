apiVersion: ://coreos.com
kind: PrometheusRule
metadata:
  name: self-healing-pod-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: self-healing.rules
    rules:
    - alert: PodStuckInCrashLoop
      expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Pod {{ $labels.pod }} is failing continuously."
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is stuck in CrashLoopBackOff. The Go self-healer is attempting automated remediation."
